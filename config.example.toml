# abdns configuration — copy to /etc/abdns/config.toml and edit at will:
# changes are picked up within a few seconds, without restarting (except `listen`).
# Only [[server]] is required; every other value below shows its default.

# Language of notifications: "en" or "fr".
language = "en"

# Where the system sends its DNS queries.
listen = ["127.0.0.1:53", "[::1]:53"]

# Last resort: use the network's DNS (in clear, every name reported) when no encrypted
# server answers. Needed to sign in to captive portals (train, hotel, airport Wi-Fi).
local_fallback = true

# State (status, forced mode) and names sent in clear.
state_dir = "/var/run/abdns"
clear_log = "/var/log/abdns/clear.log"

# macOS network services whose DNS points to abdns (networksetup -listallnetworkservices).
# Ignored on Linux: abdns takes over every physical interface the computer goes out by.
network_services = ["Wi-Fi"]

# Notifications. false: none at all, everything still goes to the log (abdns logs).
[notify]
enabled = true

# DNS-over-HTTPS servers, tried in this order. Replace them with your own resolver and
# privacy-respecting fallbacks; these two are only well-known examples.
[[server]]
name = "Google"
url = "https://8.8.8.8/dns-query"

[[server]]
name = "Cloudflare"
url = "https://1.1.1.1/dns-query"

# Your own resolver, with a secret path kept out of this file (url ends with "/"):
# [[server]]
# name = "My resolver"
# url = "https://203.0.113.5/dns-query/"
# token_file = "/etc/abdns/token"
#
# A server known by name must also give its address, so that it is reached without any
# plaintext lookup:
# [[server]]
# name = "Mullvad"
# url = "https://dns.mullvad.net/dns-query"
# ip = "194.242.2.2"
