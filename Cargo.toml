[package]
name = "abdns"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
description = "Encrypted DNS for your computer: your own DoH resolver first, ordered encrypted fallbacks, network DNS only as a last resort for captive portals"
repository = "https://github.com/abnd-corp/Abdns"
readme = "README.md"
keywords = ["dns", "doh", "privacy", "captive-portal", "resolver"]
categories = ["network-programming", "command-line-utilities"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "signal", "io-util"] }
hyper = { version = "1", default-features = false, features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", default-features = false, features = ["client-legacy", "http1", "http2", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "tls12", "rustls-platform-verifier"] }
http-body-util = "0.1"
tower-service = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

# Appels système POSIX (terminal ; sous Linux, netlink et pare-feu). Déjà tirée par tokio.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Taille avant vitesse : 4,3 → 2,2 Mio, vitesse identique au banc (`make bench`). Pas de
# `panic = "abort"` : une panique ne doit coûter que la requête en cours, pas tout le service.
[profile.release]
strip = true
lto = "fat"
codegen-units = 1
opt-level = "z"

# Chaque bloc unsafe dit pourquoi il est correct (AGENTS.md).
[lints.clippy]
undocumented_unsafe_blocks = "deny"
