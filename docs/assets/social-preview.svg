<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <title>abdns — encrypted DNS for your computer</title>
  <defs>
    <style>
      .sans { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .mono { font-family: "SF Mono", Menlo, Consolas, monospace; }
    </style>
    <!-- Marque : les orbites du logo de l'organisation, un cadenas au centre. -->
    <g id="mark">
      <g fill="none" stroke="#ffffff" stroke-width="11">
        <ellipse cx="0" cy="0" rx="205" ry="66" transform="rotate(90)"/>
        <ellipse cx="0" cy="0" rx="205" ry="66" transform="rotate(30)"/>
        <ellipse cx="0" cy="0" rx="205" ry="66" transform="rotate(-30)"/>
      </g>
      <path d="M -26 -6 V -30 A 26 26 0 0 1 26 -30 V -6" fill="none" stroke="#ee1d23" stroke-width="13" stroke-linecap="round"/>
      <rect x="-44" y="-12" width="88" height="70" rx="14" fill="#ee1d23"/>
      <circle cx="0" cy="16" r="9" fill="#000000"/>
      <rect x="-4" y="18" width="8" height="20" rx="3" fill="#000000"/>
    </g>
  </defs>

  <rect width="1280" height="640" fill="#000000"/>
  <use href="#mark" transform="translate(300 320)"/>

  <text x="600" y="214" class="sans" font-size="124" font-weight="700" fill="#ffffff" letter-spacing="-3">abdns</text>
  <text x="604" y="270" class="sans" font-size="36" font-weight="500" fill="#ffffff">Encrypted DNS for your computer</text>
  <text x="604" y="312" class="sans" font-size="24" fill="#9b9b9b">Your resolver first · encrypted fallbacks · captive portals</text>

  <rect x="600" y="360" width="600" height="172" rx="14" fill="#121212" stroke="#2b2b2b" stroke-width="2"/>
  <circle cx="626" cy="384" r="6" fill="#3a3a3a"/>
  <circle cx="646" cy="384" r="6" fill="#3a3a3a"/>
  <circle cx="666" cy="384" r="6" fill="#3a3a3a"/>
  <g class="mono" font-size="22">
    <text x="626" y="428" fill="#6f6f6f">$</text>
    <text x="650" y="428" fill="#ffffff">abdns status</text>
    <text x="626" y="464" fill="#9b9b9b">Mode</text>
    <text x="760" y="464" fill="#ffffff">encrypted</text>
    <text x="626" y="500" fill="#9b9b9b">Servers</text>
    <text x="760" y="500" fill="#ee1d23">●</text>
    <text x="786" y="500" fill="#ffffff">my-resolver</text>
    <text x="944" y="500" fill="#9b9b9b">✓</text>
    <text x="968" y="500" fill="#ffffff">Mullvad</text>
    <text x="1076" y="500" fill="#9b9b9b">✓</text>
    <text x="1100" y="500" fill="#ffffff">DNS.SB</text>
  </g>

  <text x="600" y="590" class="sans" font-size="20" fill="#6f6f6f">macOS · Rust · AGPL-3.0</text>
  <text x="1200" y="590" class="sans" font-size="20" fill="#6f6f6f" text-anchor="end">github.com/abnd-corp/Abdns</text>
</svg>
